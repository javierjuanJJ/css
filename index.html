<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1 {
            /* RGB (Formato moderno, sin comas) [9] */
            color: rgb(0 0 0);
        }

        .link {
            /* Hexadecimal abreviado (#09F es igual a #0099FF) [8] */
            color: #09F;
        }

        #show {
            /* Hexadecimal (forma más popular) [7] */
            color: #FF9900;
        }

        body {
            background: Pink;
            /* Estiliza el fondo del documento [6] */
            /* Palabras clave */
            color: blue;

            /* RGB con opacidad (se recomienda usar la barra en lugar de rgba) [9] */
            color: rgb(0 0 0 / 0.1);

            /* HSL (Matiz, Saturación, Luminosidad) [10] */
            color: hsl(60% 83% 44%);
        }

        /* Estado: cursor sobre el elemento */
        .link:hover {
            color: yellow;
            outline: 3px solid yellow;
            /* outline se recomienda sobre border para evitar que el layout salte [14] */
        }

        /* Estado: haciendo clic activamente */
        .link:active {
            color: blue;
        }

        /* Estado: campo de entrada seleccionado (foco) */
        input:focus {
            border: 1px solid yellow;
        }

        /* Estado: Primer hijo de un contenedor [16] */
        ul li:first-child {
            color: pink;
        }
    </style>

</head>

<body>

    <h1>Título</h1>

    <a class="link">Link</a>
    <button id="show">Ver</button>
</body>

</html>
