<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .link {
            color: green;
        }

        /* Hover (Cursor encima) */
        .link:hover {
            color: yellow;
        }

        /* Active (Haciendo click activamente) */
        .link:active {
            color: blue;
        }

        /* Focus (Elemento seleccionado, típico en inputs) */
        .input:focus {
            outline: 3px solid orangered;
        }

        /* Primer hijo de un contenedor */
        .link:first-child {
            color: pink;
        }

        /* Último hijo de un contenedor */
        .link:last-child {
            color: purple;
        }

        .link:nth-child(2) {
            color: black;
        }

        .link:nth-child(3) {
            color: orange;
        }
    </style>

</head>

<body>
    <a href="#" class="link">Link 1</a>
    <a href="#" class="link">Link 2</a>
    <a href="#" class="link">Link 3</a>
    <a href="#" class="link">Link 4</a>
    <input type="text" name="name1" id="name1" class="input" />
</body>

</html>
