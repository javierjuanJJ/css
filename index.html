<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container {
            color: blue;
            font-size: 32px;
            border: 3px solid blue;
        }

        .child {
            border: inherit;
            font-size: initial;
        }

    </style>

</head>

<body>
    <div class="container">
        Este es un container
        <div class="child">
            Hola mundo
        </div>
    </div>
</body>

</html>
